<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>君に花束を贈るなら｜草花をさがす</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/search.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-pink">
      <div class="header-logo">
        <a href="index.html"><img src="assets/image/logo_small.svg" alt="君に花束を贈るなら" /></a>
      </div>
    </div>
    <div class="header-white">
      <nav class="header-nav" aria-label="グローバルナビゲーション">
        <ul>
          <li><a href="#">おしらせ</a></li>
          <li><a href="search.html">草花のページ</a></li>
          <li><a href="#">樹木のページ</a></li>
          <li><a href="#">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main>
    <div class="main-content">

      <!-- 操作パレット -->
      <aside class="palette" id="palette">

        <!-- 花の名前 / 品種 -->
        <div class="palette-section">
          <h3>花の名前 / 品種</h3>
          <input type="text" class="palette-input" id="nameInput" placeholder="例: バラ" />
        </div>

        <!-- 花の色 -->
        <div class="palette-section">
          <h3>花の色</h3>
          <div class="color-bar-wrapper" id="colorBarWrapper">
            <div class="color-bar-track" id="colorBarTrack"></div>
            <div class="color-bar-thumb" id="colorBarThumb"></div>
          </div>
          <div class="color-bar-active-dot" id="colorBarDot"></div>
          <div class="color-bar-label" id="colorBarLabel">未選択</div>
          <button class="color-bar-reset" id="colorBarReset">リセット</button>
        </div>

        <!-- 開花月 -->
        <div class="palette-section">
          <h3>開花月</h3>
          <div class="month-grid" id="monthGrid"></div>
        </div>

        <!-- シーン -->
        <div class="palette-section">
          <h3>シーン</h3>
          <div class="badge-group" id="sceneGroup"></div>
        </div>

        <!-- 栽培方法 -->
        <div class="palette-section">
          <h3>栽培方法</h3>
          <div class="badge-group" id="cultivationGroup"></div>
        </div>

        <!-- 花言葉 -->
        <div class="palette-section">
          <h3>花言葉</h3>
          <input type="text" class="palette-input" id="meaningInput" placeholder="例: 愛" />
        </div>

      </aside>

      <!-- テーブル -->
      <div class="table-area">
        <table class="flower-table" id="flowerTable">
          <thead>
            <tr>
              <th class="sortable" data-col="name">
                名前<span class="sort-icon none" id="sort-name"></span>
              </th>
              <th class="sortable" data-col="variety">
                品種<span class="sort-icon none" id="sort-variety"></span>
              </th>
              <th>色</th>
              <th>栽培方法</th>
              <th>開花月</th>
              <th>シーン</th>
              <th>花言葉</th>
            </tr>
          </thead>
          <tbody id="flowerTableBody"></tbody>
        </table>
        <div class="no-results" id="noResults" style="display:none;">
          該当する花が見つかりませんでした
        </div>
      </div>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p class="footer-copyright">
      &copy; 2025 君に花束を贈るなら. All rights reserved.
    </p>
  </footer>

  <!-- 素のスクリプトを順番に読み込む（fetch / ES モジュール不使用。file:// でも動く） -->
  <script src="js/flowers.js"></script>
  <script src="js/color.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
