<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>君に花束を贈るなら</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <!-- ピンク領域 (PC: 120px / スマホ: 50px) -->
    <div class="header-pink">
      <!-- タイトルロゴ: ピンク/白境界線を縦中心に跨いで配置 -->
      <div class="header-logo">
        <img src="assets/image/logo_small.svg" alt="君に花束を贈るなら" />
      </div>
    </div>

    <!-- 白領域 (PC: 100px / スマホ: 40px) -->
    <div class="header-white">
      <!-- ナビゲーション（メニューは <li> を追加するだけで拡張可能） -->
      <nav class="header-nav" aria-label="グローバルナビゲーション">
        <ul>
          <li><a href="#">おしらせ</a></li>
          <li><a href="search.html">草花のページ</a></li>
          <li><a href="#">樹木のページ</a></li>
          <li><a href="#">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main>
    <div class="main-content">
      <!-- 背景画像: センタリング・PC/タブレットは高さ90%・スマホは幅90% -->
      <img class="main-content-bg" src="assets/image/background.png" alt="" />
      <!-- ここにメインコンテンツを配置してください -->
      <span class="main-content-placeholder">メインコンテンツ</span>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p class="footer-copyright">
      &copy; 2025 君に花束を贈るなら. All rights reserved.
    </p>
  </footer>

</body>
</html>
